name: publish-wechat
on:
  push:
    branches: [main]
    paths: ['wechat-runs/**']
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Need HEAD^ so we can publish every wechat-runs slug touched in this push
          # (Chinese + English listening draft land together).
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: configure ssh to droplet
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -t ed25519 "$DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: publish touched wechat runs via droplet
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          WECHAT_DRAFT_PROXY_HOST: root@${{ secrets.DROPLET_HOST }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Resolve touched slugs in Python to avoid bash pipefail/grep pitfalls.
          mapfile -t slugs < <(python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def run(args):
              return subprocess.check_output(args, text=True).strip()

          slugs = []
          try:
              run(["git", "rev-parse", "--verify", "HEAD^"])
              names = run(["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD", "--", "wechat-runs/"])
              seen = set()
              for line in names.splitlines():
                  parts = Path(line).parts
                  if len(parts) >= 2 and parts[0] == "wechat-runs":
                      slug = parts[1]
                      if slug and not slug.startswith(".") and slug not in seen:
                          seen.add(slug)
                          slugs.append(slug)
          except subprocess.CalledProcessError:
              pass

          if not slugs:
              root = Path("wechat-runs")
              if root.exists():
                  candidates = sorted(p.name for p in root.iterdir() if p.is_dir() and not p.name.startswith("."))
                  if candidates:
                      slugs = [candidates[-1]]

          if not slugs:
              raise SystemExit("no wechat-runs/ found")
          print("\n".join(slugs))
          PY
          )

          echo "touched_slugs: ${slugs[*]}"
          for slug in "${slugs[@]}"; do
            html="wechat-runs/$slug/article.wechat.html"
            cover="wechat-runs/$slug/abstract_cover.png"
            meta="wechat-runs/$slug/meta.json"
            [ -f "$html" ] || { echo "missing $html"; exit 1; }
            [ -f "$cover" ] || { echo "missing $cover — Action requires cover in wechat-runs"; exit 1; }
            title=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['title'])" "$meta")
            locale=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('locale') or '')" "$meta")
            author=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('author') or '')" "$meta")
            if [ -z "$author" ]; then
              if [ "$locale" = "en" ]; then
                author="RhinoFinance"
              else
                author="AI 美股分析师"
              fi
            fi
            thumb_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/wechat-runs/${slug}/abstract_cover.png"
            echo "publishing: $title"
            echo "selected_slug: $slug"
            echo "locale: ${locale:-zh}"
            echo "cover_url: $thumb_url"
            python3 scripts/wechat_draft_via_droplet.py \
              --html-file "$html" \
              --title "$title" \
              --author "$author" \
              --thumb-image-url "$thumb_url"
          done
