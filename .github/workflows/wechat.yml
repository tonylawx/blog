name: publish-wechat
on:
  push:
    branches: [main]
    paths: ['wechat-runs/**']
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Need HEAD^ so we can publish every wechat-runs slug touched in this push
          # (Chinese + English listening draft land together).
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: configure ssh to droplet
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -t ed25519 "$DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: publish touched wechat runs via droplet
        working-directory: scripts
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          WECHAT_DRAFT_PROXY_HOST: root@${{ secrets.DROPLET_HOST }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prefer every slug touched by this commit. After checkout, `ls -1t`
          # mtimes are unreliable and previously republished the Chinese sibling
          # when an English `*-en` folder was the intended change.
          slugs=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            slugs=$(git diff-tree --no-commit-id --name-only -r HEAD -- wechat-runs/ \
              | awk -F/ 'NF>=2 {print $2}' \
              | grep -vE '^\.' \
              | awk 'NF && !seen[$0]++')
          fi
          if [ -z "${slugs:-}" ]; then
            slugs=$(ls -1 ../wechat-runs/ 2>/dev/null | grep -vE '^\.' | sort | tail -1)
          fi
          [ -n "${slugs:-}" ] || { echo "no wechat-runs/ found"; exit 1; }

          printf '%s\n' "$slugs" | while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            html="../wechat-runs/$slug/article.wechat.html"
            cover="../wechat-runs/$slug/abstract_cover.png"
            meta="../wechat-runs/$slug/meta.json"
            [ -f "$html" ] || { echo "missing $html"; exit 1; }
            [ -f "$cover" ] || { echo "missing $cover — Action requires cover in wechat-runs"; exit 1; }
            title=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['title'])" "$meta" 2>/dev/null || echo "$slug")
            locale=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('locale',''))" "$meta" 2>/dev/null || true)
            author=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('author',''))" "$meta" 2>/dev/null || true)
            if [ -z "$author" ]; then
              if [ "$locale" = "en" ]; then
                author="AI US Market Analyst"
              else
                author="AI 美股分析师"
              fi
            fi
            thumb_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/wechat-runs/${slug}/abstract_cover.png"
            echo "publishing: $title"
            echo "selected_slug: $slug"
            echo "locale: ${locale:-zh}"
            echo "cover_url: $thumb_url"
            python3 wechat_draft_via_droplet.py \
              --html-file "$html" \
              --title "$title" \
              --author "$author" \
              --thumb-image-url "$thumb_url"
          done
