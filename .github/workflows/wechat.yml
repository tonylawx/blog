# Temporary diagnostic branch only. Replace the already-registered wechat.yml
# on that branch; do not merge or invoke the normal draft/add workflow.
name: patch-existing-wechat-images
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Upload images and update the existing draft (false only checks)
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: existing-wechat-images-20261029
  cancel-in-progress: false

jobs:
  patch:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: locate and mask the existing draft id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, urllib.request
          # PR225's successful two-article draft/add, not the earlier daily draft.
          request = urllib.request.Request(
              'https://api.github.com/repos/tonylawx/blog/actions/jobs/123881736962/logs',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=60) as response:
              logs = response.read().decode('utf-8')
          logs = re.sub(r'^\d{4}-\d\d-\d\dT\S+\s?', '', logs, flags=re.M)
          ids = re.findall(r'"draft"\s*:\s*\{\s*"media_id"\s*:\s*"([^"\r\n]+)"', logs)
          if len(ids) != 1 or hashlib.sha256(ids[0].encode()).hexdigest() != '8f66fb7a2bae3b06d96e6285b590f11d052da61237217c1bc90a93e74fa4e9b6':
              raise SystemExit('Source job did not identify the expected existing draft')
          print('::add-mask::' + ids[0])
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('WECHAT_DRAFT_MEDIA_ID=' + ids[0] + '\n')
          print('Verified existing draft id hash from source job')
          PY
      - name: configure ssh to droplet
        env:
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -t ed25519 "$DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: check or patch existing draft through droplet
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          WECHAT_DRAFT_PROXY_HOST: root@${{ secrets.DROPLET_HOST }}
          APPLY_PATCH: ${{ inputs.apply }}
        run: |
          set -eu
          if [ "$APPLY_PATCH" = true ]; then
            python3 scripts/wechat_patch_draft_images.py --via-droplet --manifest .diagnostics/wechat-20261029-images.json --apply
          else
            python3 scripts/wechat_patch_draft_images.py --via-droplet --manifest .diagnostics/wechat-20261029-images.json
          fi
